name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/check_repository_secrets.py --history
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: jordy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d jordy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/jordy_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check backend scripts tests migrations
      - run: uv run ruff format --check backend scripts tests migrations
      - run: uv run pytest -q
