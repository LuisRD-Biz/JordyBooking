services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: jordy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jordy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jordy -d jordy"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
